<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Справочник к боту «Физика с Ньютоном»: формулы, термины, зависимости и теория номеров экзамена по вкладкам и таблицам, с поиском.">
<title>Справочник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Те же цвета и шрифты, что у калькулятора, опытов и геометрии. */
:root {
  --paper: #f5f8fb; --sheet: #ffffff; --ink: #14304d; --muted: #566b80; --line: #d3dde7;
  --chip: #eef3f8; --accent: #1f5fbf; --accent-ink: #ffffff; --mark: #fff1b8;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1822; --sheet: #15222f; --ink: #e6eef6; --muted: #9db0c2; --line: #2a3b4c;
  --chip: #1c2b3a; --accent: #6ea8ff; --accent-ink: #0e1822; --mark: #5a4a12;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0e1822; --sheet: #15222f; --ink: #e6eef6; --muted: #9db0c2; --line: #2a3b4c;
  --chip: #1c2b3a; --accent: #6ea8ff; --accent-ink: #0e1822; --mark: #5a4a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
header.top { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 10px 0 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
h1 { font: 700 17px/1.3 var(--body); margin: 0; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.search { width: 100%; font: 400 16px var(--body); color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
/* Вкладки и разделы прокручиваются вбок: на телефоне их больше, чем помещается */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; font: 600 13px var(--body); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chips button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips.sub button { font-weight: 500; background: var(--chip); border-color: transparent; }
.chips.sub button[aria-current="true"] { background: var(--ink); color: var(--paper); }
main { display: grid; gap: 14px; padding-top: 12px; }
h2 { font: 700 15px/1.3 var(--body); margin: 6px 0 0; }
.empty { color: var(--muted); text-align: center; padding: 28px 8px; }
table.rt { width: 100%; border-collapse: collapse; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; table-layout: fixed; }
.rt th { text-align: left; font: 600 12px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .03em; padding: 7px 10px; background: var(--chip); }
.rt td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word; hyphens: auto; }
.rt td.f { overflow-wrap: anywhere; hyphens: none; font: 500 15px/1.4 var(--mono); }
.rt td.term { font-weight: 600; }
.extra { display: block; color: var(--muted); font: 400 13px/1.4 var(--body); margin-top: 4px; }
.extra b { color: var(--ink); font-weight: 600; }
mark { background: var(--mark); color: inherit; border-radius: 3px; }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 0; }
.card summary { cursor: pointer; padding: 10px 12px; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: baseline; }
.card summary::-webkit-details-marker { display: none; }
.card summary .num { font: 700 15px var(--mono); color: var(--accent); flex: none; min-width: 2.6em; }
.card[open] summary { border-bottom: 1px solid var(--line); }
.card .body { padding: 10px 12px; display: grid; gap: 8px; }
.card .body p { margin: 0; }
.card table.rt { border-radius: 6px; }
.typing { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap; }
code { font: 500 14px var(--mono); background: var(--chip); padding: 1px 5px; border-radius: 4px; }
sub { font-size: 0.72em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="title">📚 Справочник</h1>
    <p class="note" id="note" hidden></p>
    <nav class="chips" id="tabs" aria-label="Разделы справочника"></nav>
    <input class="search" id="search" type="search" placeholder="Поиск: формула, буква, слово" autocomplete="off" aria-label="Поиск по справочнику">
    <nav class="chips sub" id="groups" aria-label="Темы" hidden></nav>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<script>
"use strict";
// Telegram открывает страницу на полэкрана: сразу просим весь экран
function telegram(event, data = {}) {
  try {
    if (window.TelegramWebviewProxy) window.TelegramWebviewProxy.postEvent(event, JSON.stringify(data));
    else if (window.parent !== window) window.parent.postMessage(JSON.stringify({ eventType: event, eventData: data }), "*");
  } catch {}
}
telegram("web_app_ready");
telegram("web_app_expand");

// Адрес: ?s=phys&m=8&d=5&tab=formulas&t=mech
//   s — предмет, m — класс или экзамен, d — сколько шагов пути пройдено (без d открыто всё),
//   tab — вкладка, t — тема формул (бот передаёт тему задачи, которую ученик решает).
const params = new URLSearchParams(location.search);
const SUBJECTS = ["phys", "math", "info", "chem"];
const subject = SUBJECTS.includes(params.get("s")) ? params.get("s") : "phys";

function el(tag, attrs = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === "html") node.innerHTML = v; else node.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
  return node;
}
function script(src) {
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); });
}

// Поиск без учёта регистра, ё и пробелов вокруг знаков: «F=ma» найдёт «F = m · a»
function norm(s) { return String(s).toLowerCase().replace(/ё/g, "е").replace(/[\s·*]/g, ""); }
function highlight(text, query) {
  const frag = document.createDocumentFragment();
  if (!query) { frag.append(text); return frag; }
  const q = query.toLowerCase().replace(/ё/g, "е");
  const low = text.toLowerCase().replace(/ё/g, "е");
  let i = 0, at;
  while (q && (at = low.indexOf(q, i)) !== -1) {
    frag.append(text.slice(i, at), el("mark", {}, text.slice(at, at + q.length)));
    i = at + q.length;
  }
  frag.append(text.slice(i));
  return frag;
}
// Химические формулы в данных с обычными цифрами там, где их вписали руками: H2SO4 → H₂SO₄
function chem(s) { return s.replace(/([A-Za-zа-я)\]])(\d+)/g, (_, a, n) => a + n.replace(/\d/g, d => "₀₁₂₃₄₅₆₇₈₉"[d])); }

let D, mode, open, state = { tab: null, group: "all", query: "" };

function start() {
  D = REF_DATA;
  mode = D.modes[params.get("m")] ? params.get("m") : Object.keys(D.modes).at(-1);
  // Пройденное в классе: как в боте, только формулы, термины и зависимости первых d шагов пути
  const steps = D.paths[mode];
  const d = parseInt(params.get("d"), 10);
  if (steps && Number.isFinite(d)) {
    const done = steps.slice(0, Math.max(0, d));
    open = { f: new Set(done.flatMap(s => s.f)), w: new Set(done.flatMap(s => s.w)), d: new Set(done.flatMap(s => s.d)) };
  }
  document.title = `Справочник · ${D.title.replace(/^\S+\s/, "")}`;
  document.getElementById("title").textContent = `📚 Справочник · ${D.title} · ${D.modes[mode]}`;
  if (open) {
    const note = document.getElementById("note");
    note.hidden = false;
    note.textContent = "Здесь только пройденные темы, остальные откроются на пути 🗺";
  }
  buildTabs();
  const search = document.getElementById("search");
  search.addEventListener("input", () => { state.query = search.value.trim(); render(); });
}

// ---------- что показывать ----------

function inMode(item) { return item.m.includes(mode); }
function formulas() { return D.formulas.filter(f => inMode(f) && (!open || open.f.has(f.id))); }
function terms() { return D.terms.filter(t => inMode(t) && (!open || open.w.has(t.w))); }
function deps() { return D.deps.filter(x => inMode(x) && (!open || open.d.has(x.k))); }
function trivial() {
  const limit = mode === "ege" ? 99 : mode === "oge" ? 9 : parseInt(mode, 10);
  return (D.trivial || []).filter(t => t.g <= limit);
}
const CHEM_TABS = { table: "📋 Менделеев", sol: "💧 Растворимость", act: "⚡ Ряд активности" };

function tabList() {
  const tabs = [["formulas", "🧮 Формулы"], ["terms", "📖 Термины"]];
  if (deps().length) tabs.push(["deps", "🔗 Зависимости"]);
  if (D.exam[mode]) tabs.push(["exam", "🎓 Номера экзамена"]);
  if (subject === "chem") {
    if (trivial().length) tabs.push(["trivial", "🏷 Тривиальные"]);
    tabs.push(...Object.entries(CHEM_TABS));
  }
  tabs.push(["typing", "✍️ Как вводить"]);
  return tabs;
}

function buildTabs() {
  const tabs = tabList();
  const nav = document.getElementById("tabs");
  nav.replaceChildren(...tabs.map(([key, label]) => el("button", { type: "button", "data-tab": key }, label)));
  nav.addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.tab); });
  const want = params.get("tab");
  showTab(tabs.some(([k]) => k === want) ? want : tabs[0][0], params.get("t"));
}

function showTab(tab, group) {
  state.tab = tab;
  state.group = group || "all";
  for (const b of document.querySelectorAll("#tabs button")) {
    const on = b.dataset.tab === tab;
    b.setAttribute("aria-current", String(on));
    if (on) b.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  const searchable = ["formulas", "terms", "deps", "exam", "trivial"].includes(tab);
  document.getElementById("search").hidden = !searchable;
  render();
  window.scrollTo(0, 0);
}

// ---------- разделы внутри вкладки ----------

function groupsFor(tab) {
  if (tab === "formulas") {
    const used = new Set(formulas().map(f => f.t));
    return Object.entries(D.topics).filter(([k]) => used.has(k));
  }
  if (tab === "terms") return termGroups().map(([k, title]) => [k, title]);
  return [];
}
// В классе термины идут по разделам пути, как в учебнике; в экзамене по классу, где их проходят впервые
function termOf(t) {
  if (D.paths[mode]) {
    const i = D.paths[mode].findIndex(s => s.w.includes(t.w));
    return i === -1 ? "other" : "u" + D.paths[mode][i].u;
  }
  return "g" + t.g;
}
function termGroups() {
  const used = new Set(terms().map(termOf));
  const list = D.paths[mode]
    ? D.units[mode].map((title, i) => ["u" + i, title])
    : [...new Set(terms().map(t => t.g))].sort((a, b) => a - b).map(g => ["g" + g, `${g} класс`]);
  return [...list, ["other", "Другое"]].filter(([k]) => used.has(k));
}

function renderGroups(groups) {
  const nav = document.getElementById("groups");
  nav.hidden = groups.length < 2 || !!state.query;
  if (nav.hidden) return;
  if (!groups.some(([k]) => k === state.group)) state.group = "all";
  nav.replaceChildren(...[["all", "Все"], ...groups].map(([k, label]) =>
    el("button", { type: "button", "aria-current": String(k === state.group), "data-group": k }, label)));
  nav.onclick = e => { const b = e.target.closest("button"); if (b) { state.group = b.dataset.group; render(); window.scrollTo(0, 0); } };
  const cur = nav.querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
}

// ---------- вкладки ----------

function render() {
  const view = document.getElementById("view");
  const groups = groupsFor(state.tab);
  renderGroups(groups);
  const builders = { formulas: viewFormulas, terms: viewTerms, deps: viewDeps, exam: viewExam, trivial: viewTrivial, typing: viewTyping };
  if (CHEM_TABS[state.tab]) return viewChemTable(view, state.tab);
  view.replaceChildren(...[].concat(builders[state.tab](groups)));
}

function matches(...fields) {
  if (!state.query) return true;
  const q = norm(state.query);
  return fields.some(f => f && norm(f).includes(q));
}
function sections(items, groups, keyOf, makeTable) {
  const out = [];
  for (const [key, title] of groups.length ? groups : [["all", ""]]) {
    if (state.group !== "all" && state.group !== key && !state.query) continue;
    const part = groups.length ? items.filter(x => keyOf(x) === key) : items;
    if (!part.length) continue;
    if (title && (state.group === "all" || state.query)) out.push(el("h2", {}, title));
    out.push(makeTable(part));
  }
  return out.length ? out : [el("p", { class: "empty" }, state.query ? "Ничего не нашлось. Попробуй другое слово или букву." : "Здесь пока пусто: темы откроются на пути 🗺")];
}

function viewFormulas(groups) {
  const q = state.query;
  const items = formulas().filter(f => matches(f.n, f.e, f.l, ...f.a));
  return sections(items, groups, f => f.t, part => el("table", { class: "rt" },
    el("colgroup", {}, el("col", { style: "width:45%" }), el("col")),
    el("thead", {}, el("tr", {}, el("th", {}, "Что"), el("th", {}, "Формула"))),
    el("tbody", {}, part.map(f => {
      const extra = [];
      if (f.a.length) extra.push(el("span", { class: "extra" }, el("b", {}, "Также верно: "), f.a.join(";  ")));
      if (f.l) extra.push(el("span", { class: "extra" }, highlight(f.l, q)));
      return el("tr", {}, el("td", {}, highlight(f.n, q)), el("td", { class: "f" }, highlight(f.e, q), extra));
    }))));
}

function viewTerms(groups) {
  const q = state.query;
  const items = terms().filter(t => matches(t.w, t.d));
  return sections(items, groups, termOf, part => el("table", { class: "rt" },
    el("colgroup", {}, el("col", { style: "width:34%" }), el("col")),
    el("thead", {}, el("tr", {}, el("th", {}, "Термин"), el("th", {}, "Определение"))),
    el("tbody", {}, part.map(t => el("tr", {}, el("td", { class: "term" }, highlight(t.w, q)), el("td", {}, highlight(t.d, q)))))));
}

function viewDeps() {
  const q = state.query;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const items = deps().filter(x => matches(x.q, x.on, x.r, x.f, x.c));
  return sections(items, [], null, part => el("table", { class: "rt" },
    el("colgroup", {}, el("col", { style: "width:42%" }), el("col")),
    el("thead", {}, el("tr", {}, el("th", {}, "Величина"), el("th", {}, "Как зависит"))),
    el("tbody", {}, part.map(x => el("tr", {},
      el("td", {}, highlight(cap(x.q), q), el("span", { class: "extra" }, "от ", highlight(x.on, q))),
      el("td", {}, el("b", {}, highlight(x.r, q)), x.c ? el("span", { class: "extra" }, highlight(x.c, q)) : null,
        el("span", { class: "extra" }, el("code", {}, highlight(x.f, q)))))))));
}

function viewExam() {
  const q = state.query;
  const cards = D.exam[mode].filter(c => matches(c.title, c.checks, c.plan, c.mistake, `№${c.n}`, ...c.f.flat()));
  if (!cards.length) return [el("p", { class: "empty" }, "Ничего не нашлось. Попробуй другое слово.")];
  return [el("p", { class: "note" }, "Нажми на номер: что проверяют, нужные формулы, как решать и частая ошибка."),
    ...cards.map(c => el("details", { class: "card", open: !!q },
      el("summary", {}, el("span", { class: "num" }, `№ ${c.n}`), el("span", {}, highlight(c.title, q))),
      el("div", { class: "body" },
        el("p", {}, el("b", {}, "Что проверяют: "), highlight(c.checks, q)),
        c.f.length ? el("table", { class: "rt" }, el("colgroup", {}, el("col", { style: "width:45%" }), el("col")),
          el("tbody", {}, c.f.map(([n, e]) => el("tr", {}, el("td", {}, n), el("td", { class: "f" }, e))))) : null,
        el("p", {}, el("b", {}, "Как решать: "), highlight(c.plan, q)),
        el("p", {}, el("b", {}, "Частая ошибка: "), highlight(c.mistake, q)))))];
}

function viewTrivial() {
  const q = state.query;
  const items = trivial().filter(t => matches(t.f, t.c, ...t.n));
  return sections(items, [], null, part => el("table", { class: "rt" },
    el("colgroup", {}, el("col", { style: "width:24%" }), el("col"), el("col", { style: "width:36%" })),
    el("thead", {}, el("tr", {}, el("th", {}, "Формула"), el("th", {}, "Как называют"), el("th", {}, "Химическое название"))),
    el("tbody", {}, part.map(t => el("tr", {}, el("td", { class: "f" }, highlight(chem(t.f), q)),
      el("td", { class: "term" }, highlight(t.n.join(", "), q)), el("td", {}, highlight(t.c, q)))))));
}

function viewTyping() {
  // Подсказка из бота: там только <b> и <code>, переводы строк сохраняются
  return [el("div", { class: "typing", html: D.typing.replace(/\/input/g, "") })];
}

// Таблицы химии те же, что в калькуляторе и лаборатории: загружаются, только когда их открыли
const chemViews = {};
async function viewChemTable(view, tab) {
  if (!chemViews[tab]) {
    chemViews[tab] = el("div", {});
    try {
      if (!window.PTable) await script("ptable.js");
      if (!window.ChemRef) { await script("chem-tables.js"); await script("chemref.js"); }
      if (tab === "table") PTable.mount(chemViews[tab]);
      else if (tab === "sol") ChemRef.solubility(chemViews[tab]);
      else ChemRef.activity(chemViews[tab]);
    } catch {
      chemViews[tab].replaceChildren(el("p", { class: "empty" }, "Таблица не загрузилась. Проверь интернет и открой вкладку ещё раз."));
      delete chemViews[tab];
    }
  }
  if (state.tab === tab) view.replaceChildren(chemViews[tab] || el("p", { class: "empty" }, "Загружаю…"));
}

script(`ref-${subject}.js`).then(start, () => {
  document.getElementById("view").replaceChildren(el("p", { class: "empty" }, "Справочник не загрузился. Проверь интернет и открой его ещё раз."));
});
</script>
</body>
</html>
