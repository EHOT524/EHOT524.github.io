<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Геометрия для школьников: углы, окружности и доказательства с рисунками.">
<title>Геометрия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Те же цвета и шрифты, что у опытов и задания 26. */
:root {
  --paper: #f5f8fb; --sheet: #ffffff; --ink: #14304d; --muted: #566b80; --line: #d3dde7;
  --accent: #1f5fbf; --accent-ink: #ffffff; --hit: #d3421f; --good: #1d8a5f;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1822; --sheet: #15222f; --ink: #e6eef6; --muted: #9db0c2; --line: #2a3b4c;
  --accent: #6ea8ff; --accent-ink: #0e1822; --hit: #ff8a63; --good: #4fd19c;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0e1822; --sheet: #15222f; --ink: #e6eef6; --muted: #9db0c2; --line: #2a3b4c;
  --accent: #6ea8ff; --accent-ink: #0e1822; --hit: #ff8a63; --good: #4fd19c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 16px 48px; display: grid; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(24px, 6vw, 36px); font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; }
h2 { font-size: 15px; font-weight: 500; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lead, .note { color: var(--muted); }
.note { font-size: 14px; }
.tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.tabs button { padding: 9px 6px; font-size: 14px; border-color: var(--line); color: var(--ink); }
.tabs button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sheet { display: grid; gap: 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
button { font: 600 16px var(--body); padding: 12px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
button.main { background: var(--accent); color: var(--accent-ink); }
.option { text-align: left; font-weight: 500; font-size: 15px; border-color: var(--line); color: var(--ink); padding: 10px 12px; }
.option.right { border-color: var(--good); color: var(--good); }
.option.wrong { border-color: var(--hit); color: var(--hit); }
.block { display: grid; gap: 8px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.row input { font: 500 18px var(--mono); padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); width: 100%; }
.why { font-size: 15px; }
.why.right { color: var(--good); }
.why.wrong { color: var(--hit); }
.reads { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.read { background: var(--sheet); padding: 8px 10px; min-width: 0; }
.read span { display: block; color: var(--muted); font-size: 12px; }
.read b { font: 500 17px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.chain { margin: 0; padding-left: 22px; display: grid; gap: 2px; }
.card { text-align: left; color: var(--ink); border-color: var(--line); font-weight: 500; }
.card:hover { border-color: var(--accent); }
.verdict { font-weight: 600; }
svg.fig { display: block; width: 100%; height: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; user-select: none; -webkit-user-select: none; }
.fig .s { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig .thin { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.fig .dash { stroke: var(--muted); stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
.fig .new { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; }
.fig .mark { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.fig .find { stroke: var(--hit); stroke-width: 2.5; fill: none; }
.fig .fill { fill: var(--accent); fill-opacity: .14; stroke: var(--accent); stroke-width: 1.5; }
.fig .dot { fill: var(--ink); }
.fig text { fill: var(--ink); font: 500 15px var(--body); text-anchor: middle; dominant-baseline: central; }
.fig text.x { fill: var(--hit); font-weight: 600; }
.fig .grip { fill: var(--accent); stroke: var(--sheet); stroke-width: 2; }
.fig .hit { fill: transparent; cursor: grab; touch-action: none; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:8px">
    <h1>Геометрия</h1>
    <p class="lead">Углы, окружности и доказательства с рисунками. Это тренировка: опыт и стрик в боте здесь не начисляются.</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <main id="view" style="display:grid;gap:16px"></main>
</div>
<script>
"use strict";
// Режим из бота: в классах показываем темы до этого класса, в ОГЭ до девятого
const params = new URLSearchParams(location.search);
const mode = params.get("mode");
const LIMIT = { oge: 9, ege: 11, ege_base: 11 }[mode] || Number(mode) || 11;

// В Telegram вертикальный жест сворачивает страницу и мешает тянуть точки на рисунке
try { window.TelegramWebviewProxy?.postEvent("web_app_setup_swipe_behavior", JSON.stringify({ allow_vertical_swipe: false })); } catch {}

const view = document.getElementById("view");
const rand = (a, b, step = 1) => a + step * Math.floor(Math.random() * (Math.floor((b - a) / step) + 1));
const pick = list => list[Math.floor(Math.random() * list.length)];
const shuffle = list => list.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);
const rad = d => d * Math.PI / 180;
const on = (o, r, d) => [o[0] + r * Math.cos(rad(d)), o[1] - r * Math.sin(rad(d))];
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const dir = (a, b) => Math.atan2(a[1] - b[1], b[0] - a[0]) * 180 / Math.PI;
const fix = v => v.toFixed(1);

// ---------- рисунок ----------
const seg = (a, b, cls = "s") => `<line class="${cls}" x1="${fix(a[0])}" y1="${fix(a[1])}" x2="${fix(b[0])}" y2="${fix(b[1])}"/>`;
const shape = (pts, cls = "s") => `<polygon class="${cls}" points="${pts.map(p => p.map(fix).join(",")).join(" ")}"/>`;
const ring = (c, r, cls = "s") => `<circle class="${cls}" cx="${fix(c[0])}" cy="${fix(c[1])}" r="${fix(r)}"/>`;
const dot = p => `<circle class="dot" cx="${fix(p[0])}" cy="${fix(p[1])}" r="3"/>`;
const say = (p, text, cls = "") => `<text class="${cls}" x="${fix(p[0])}" y="${fix(p[1])}">${text}</text>`;

function between(v, a, b) {  // меньший угол при вершине v: откуда начинать и насколько идти
  const from = dir(v, a);
  let turn = dir(v, b) - from;
  while (turn <= -180) turn += 360;
  while (turn > 180) turn -= 360;
  return [from, turn];
}
function angle(v, a, b) { return Math.abs(between(v, a, b)[1]); }
function mark(v, a, b, text, find = false, r = 26) {  // дуга угла и подпись на биссектрисе
  const [from, turn] = between(v, a, b);
  const s = on(v, r, from), e = on(v, r, from + turn), label = on(v, r + 15, from + turn / 2);
  const arc = `<path class="${find ? "find" : "mark"}" d="M${fix(s[0])} ${fix(s[1])}A${r} ${r} 0 0 ${turn > 0 ? 0 : 1} ${fix(e[0])} ${fix(e[1])}"/>`;
  return arc + (text ? say(label, text, find ? "x" : "") : "");
}
function square(v, a, b, size = 12) {  // значок прямого угла
  const u = on(v, size, dir(v, a)), w = on(v, size, dir(v, b));
  return `<polyline class="mark" points="${[u, [u[0] + w[0] - v[0], u[1] + w[1] - v[1]], w].map(p => p.map(fix).join(",")).join(" ")}"/>`;
}
const fig = (body, h = 240) => `<svg class="fig" viewBox="0 0 360 ${h}" role="img">${body}</svg>`;

// Треугольник с заданными углами при основании, вписанный в рисунок
function triangle(a, b) {
  const c = 180 - a - b, side = Math.sin(rad(b)) / Math.sin(rad(c));
  const top = [side * Math.cos(rad(a)), side * Math.sin(rad(a))];
  const left = Math.min(0, top[0]), right = Math.max(1, top[0]);
  const scale = Math.min(280 / (right - left), 170 / top[1]);
  const x0 = 180 - scale * (left + right) / 2, y0 = 205;
  return [[x0, y0], [x0 + scale, y0], [x0 + scale * top[0], y0 - scale * top[1]]];
}

// ---------- задачи: x всегда целое ----------
const CENTER = [180, 120], R = 95;
const TASKS = [
  { tab: "angles", grade: 7, make() {
    const a = pick([30, 40, 50, 60, 70, 80, 100, 110, 120, 130, 140, 150]), O = [180, 180], P = on(O, 130, a), A = [30, 180], B = [330, 180];
    return { text: "Лучи OA и OB образуют прямую. Найди угол x.", svg: fig(seg(A, B) + seg(O, P) + mark(O, B, P, a + "°") + mark(O, A, P, "x", true) + dot(O) + say([O[0], 200], "O") + say([20, 195], "A") + say([340, 195], "B")),
      answer: 180 - a, how: `Смежные углы в сумме дают 180°: 180 − ${a} = ${180 - a}.` };
  } },
  { tab: "angles", grade: 7, make() {
    const a = rand(30, 150, 5), O = [180, 120], r = 140, ray = d => on(O, r * (d % 180 ? 0.75 : 1), d);
    return { text: "Две прямые пересекаются. Найди угол x.", svg: fig(seg(ray(0), ray(180)) + seg(ray(a), ray(a + 180)) + mark(O, ray(0), ray(a), a + "°") + mark(O, ray(180), ray(a + 180), "x", true) + dot(O)),
      answer: a, how: "Вертикальные углы равны." };
  } },
  { tab: "angles", grade: 7, make() {
    const t = pick([40, 50, 55, 60, 65, 70, 75, 110, 115, 120, 125, 130, 140]), kind = pick(["same", "cross", "inner"]);
    const hit = y => [180 + (170 - y) / Math.tan(rad(t)) * 1 - 50 * 0, y], A = hit(170), B = hit(80);
    const up = (p, d) => on(p, 60, d), left = p => [20, p[1]], right = p => [340, p[1]];
    const end1 = hit(20), end2 = hit(225);
    let body = seg(left(A), right(A)) + seg(left(B), right(B)) + seg(end1, end2) + mark(A, right(A), up(A, t), t + "°") + dot(A) + dot(B), answer = t, how = "";
    if (kind === "same") { body += mark(B, right(B), up(B, t), "x", true); how = "Соответственные углы при параллельных прямых равны."; }
    if (kind === "cross") { body += mark(B, left(B), up(B, t + 180), "x", true); how = "Накрест лежащие углы при параллельных прямых равны."; }
    if (kind === "inner") { body += mark(B, right(B), up(B, t + 180), "x", true); answer = 180 - t; how = `Односторонние углы в сумме дают 180°: 180 − ${t} = ${180 - t}.`; }
    return { text: "Горизонтальные прямые параллельны. Найди угол x.", svg: fig(body), answer, how };
  } },
  { tab: "angles", grade: 7, make() {
    const a = rand(30, 80, 5), b = rand(30, 80, 5), [A, B, C] = triangle(a, b), c = 180 - a - b;
    return { text: "Найди угол x треугольника.", svg: fig(shape([A, B, C]) + mark(A, B, C, a + "°") + mark(B, A, C, b + "°") + mark(C, A, B, "x", true, 20)), answer: c, how: `Сумма углов треугольника 180°: 180 − ${a} − ${b} = ${c}.` };
  } },
  { tab: "angles", grade: 7, make() {
    const apex = rand(30, 110, 10), base = (180 - apex) / 2, [A, B, C] = triangle(base, base);
    return { text: "Треугольник равнобедренный: боковые стороны равны. Найди угол x при основании.", svg: fig(shape([A, B, C]) + mark(C, A, B, apex + "°", false, 20) + mark(A, B, C, "x", true)), answer: base, how: `Углы при основании равны: (180 − ${apex}) : 2 = ${base}.` };
  } },
  { tab: "angles", grade: 7, make() {
    const a = rand(40, 70, 5), c = rand(40, 70, 5), [A, B, C] = triangle(a, 180 - a - c), D = [Math.min(B[0] + 60, 345), B[1]];
    return { text: "Найди внешний угол x треугольника.", svg: fig(shape([A, B, C]) + seg(B, D) + mark(A, B, C, a + "°") + mark(C, A, B, c + "°", false, 20) + mark(B, D, C, "x", true)), answer: a + c, how: `Внешний угол равен сумме двух углов, не смежных с ним: ${a} + ${c} = ${a + c}.` };
  } },
  { tab: "angles", grade: 7, make() {
    const a = rand(25, 65, 5), [A, B, C] = triangle(a, 90);
    return { text: "Треугольник прямоугольный. Найди угол x.", svg: fig(shape([A, B, C]) + square(B, A, C) + mark(A, B, C, a + "°") + mark(C, A, B, "x", true, 20)), answer: 90 - a, how: `Острые углы в сумме дают 90°: 90 − ${a} = ${90 - a}.` };
  } },
  { tab: "circle", grade: 8, make() {
    const c = rand(40, 160, 10), A = on(CENTER, R, 270 - c / 2), B = on(CENTER, R, 270 + c / 2), C = on(CENTER, R, rand(60, 120, 10));
    return { text: "O это центр окружности. Найди вписанный угол x.", svg: fig(ring(CENTER, R) + seg(CENTER, A) + seg(CENTER, B) + seg(C, A) + seg(C, B) + mark(CENTER, A, B, c + "°", false, 18) + mark(C, A, B, "x", true) + dot(CENTER) + say([CENTER[0] + 12, CENTER[1] - 12], "O")),
      answer: c / 2, how: `Вписанный угол равен половине центрального на той же дуге: ${c} : 2 = ${c / 2}.` };
  } },
  { tab: "circle", grade: 8, make() {
    const x = rand(20, 80, 5), c = 2 * x, A = on(CENTER, R, 270 - x), B = on(CENTER, R, 270 + x), C = on(CENTER, R, rand(70, 110, 10));
    return { text: "O это центр окружности. Найди центральный угол x.", svg: fig(ring(CENTER, R) + seg(CENTER, A) + seg(CENTER, B) + seg(C, A) + seg(C, B) + mark(C, A, B, x + "°") + mark(CENTER, A, B, "x", true, 18) + dot(CENTER) + say([CENTER[0] + 12, CENTER[1] - 12], "O")),
      answer: c, how: `Центральный угол вдвое больше вписанного: ${x} · 2 = ${c}.` };
  } },
  { tab: "circle", grade: 8, make() {
    const a = rand(20, 70, 5), A = on(CENTER, R, 180), B = on(CENTER, R, 0), C = on(CENTER, R, 2 * a);
    return { text: "AB это диаметр. Найди угол x.", svg: fig(ring(CENTER, R) + shape([A, B, C]) + square(C, A, B) + mark(A, B, C, a + "°") + mark(B, A, C, "x", true) + dot(CENTER) + say([A[0] - 12, A[1]], "A") + say([B[0] + 12, B[1]], "B")),
      answer: 90 - a, how: `Угол, опирающийся на диаметр, прямой. Значит, x = 90 − ${a} = ${90 - a}.` };
  } },
  { tab: "circle", grade: 8, make() {
    const x = rand(20, 75, 5), A = on(CENTER, R, 270 - x), B = on(CENTER, R, 270 + x), C = on(CENTER, R, 130), D = on(CENTER, R, 50);
    return { text: "Найди угол x.", svg: fig(ring(CENTER, R) + seg(C, A) + seg(C, B) + seg(D, A) + seg(D, B) + mark(C, A, B, x + "°") + mark(D, A, B, "x", true)), answer: x, how: "Вписанные углы, опирающиеся на одну дугу, равны." };
  } },
  { tab: "circle", grade: 8, make() {
    const a = rand(50, 130, 5), turn = rand(-20, 20, 10), A = on(CENTER, R, 180 + turn), B = on(CENTER, R, turn - a), C = on(CENTER, R, turn), D = on(CENTER, R, turn + a);
    return { text: "Четырёхугольник вписан в окружность. Найди угол x.", svg: fig(ring(CENTER, R) + shape([A, B, C, D]) + mark(A, B, D, a + "°") + mark(C, B, D, "x", true)), answer: 180 - a, how: `Противоположные углы вписанного четырёхугольника в сумме дают 180°: 180 − ${a} = ${180 - a}.` };
  } },
  { tab: "circle", grade: 7, make() {
    const a = rand(30, 60, 5), O = [90, 120], r = 60, A = on(O, r, 90), B = [O[0] + r * Math.tan(rad(a)), A[1]], T1 = [20, A[1]], T2 = [345, A[1]];
    return { text: "Прямая касается окружности в точке A, O это центр. Найди угол x.", svg: fig(ring(O, r) + seg(T1, T2) + seg(O, A) + seg(O, B) + square(A, O, T2) + mark(O, A, B, a + "°", false, 20) + mark(B, O, A, "x", true) + say([O[0] - 12, O[1] + 6], "O") + say([A[0], A[1] - 14], "A")),
      answer: 90 - a, how: `Радиус в точку касания перпендикулярен касательной. Значит, x = 90 − ${a} = ${90 - a}.` };
  } },
  { tab: "circle", grade: 8, make() {
    const t = rand(30, 65, 5), O = [120, 120], r = 70, A = on(O, r, t), B = on(O, r, -t), P = [O[0] + r / Math.cos(rad(t)), O[1]];
    return { text: "PA и PB это касательные, O это центр. Найди угол x.", svg: fig(ring(O, r) + seg(P, A) + seg(P, B) + seg(O, A) + seg(O, B) + square(A, O, P) + square(B, O, P) + mark(P, A, B, 180 - 2 * t + "°", false, 22) + mark(O, A, B, "x", true, 18) + say([O[0] - 12, O[1]], "O") + say([P[0] + 10, P[1]], "P")),
      answer: 2 * t, how: `В четырёхугольнике OAPB два прямых угла, поэтому x = 180 − ${180 - 2 * t} = ${2 * t}.` };
  } },
];

function trainer(tab, host) {
  const pool = TASKS.filter(t => t.tab === tab && t.grade <= LIMIT);
  let done = 0, right = 0, last = null;
  function next() {
    const made = shuffle(pool).find(t => t !== last || pool.length === 1);
    last = made;
    const task = made.make();
    let tried = false;
    host.innerHTML = `<section class="sheet"><h2>Задача</h2><p>${task.text}</p>${task.svg}
      <form class="row"><input inputmode="numeric" autocomplete="off" aria-label="Ответ в градусах" placeholder="x в градусах"><button class="main" type="submit">Проверить</button></form>
      <p class="why" hidden></p><button class="more" hidden>Следующая задача</button><p class="note"></p></section>`;
    const form = host.querySelector("form"), why = host.querySelector(".why"), more = host.querySelector(".more"), note = host.querySelector(".note");
    note.textContent = done ? `Решено верно с первой попытки: ${right} из ${done}` : "";
    more.onclick = next;
    form.onsubmit = e => {
      e.preventDefault();
      const value = Number(form.elements[0].value.replace(",", ".").replace("°", "").trim());
      const ok = value === task.answer;
      if (!tried) { tried = true; done++; right += ok; }
      why.hidden = false;
      why.className = "why " + (ok ? "right" : "wrong");
      why.textContent = ok ? `Верно! ${task.how}` : "Пока нет. Посмотри на рисунок и попробуй ещё раз.";
      if (!ok && form.dataset.tried) why.textContent = `Ответ ${task.answer}°. ${task.how}`;
      form.dataset.tried = "1";
      more.hidden = !ok && why.textContent.startsWith("Пока");
    };
  }
  next();
}

// ---------- перетаскивание точек ----------
function draggable(svg, list, move, draw) {
  const point = e => { const m = svg.getScreenCTM().inverse(); return [m.a * e.clientX + m.c * e.clientY + m.e, m.b * e.clientX + m.d * e.clientY + m.f]; };
  let held = -1;
  svg.addEventListener("pointerdown", e => {
    const i = e.target.dataset?.i;

function circumcircle(A, B, C) {
  const d = 2 * (A[0] * (B[1] - C[1]) + B[0] * (C[1] - A[1]) + C[0] * (A[1] - B[1]));
  if (Math.abs(d) < 1) return null;
  const s = p => p[0] * p[0] + p[1] * p[1];
  const O = [(s(A) * (B[1] - C[1]) + s(B) * (C[1] - A[1]) + s(C) * (A[1] - B[1])) / d, (s(A) * (C[0] - B[0]) + s(B) * (A[0] - C[0]) + s(C) * (B[0] - A[0])) / d];
  return [O, dist(O, A)];
}
function incircle(A, B, C) {
  const a = dist(B, C), b = dist(A, C), c = dist(A, B), p = a + b + c;
  const O = [(a * A[0] + b * B[0] + c * C[0]) / p, (a * A[1] + b * B[1] + c * C[1]) / p];
  const area = Math.abs((B[0] - A[0]) * (C[1] - A[1]) - (C[0] - A[0]) * (B[1] - A[1])) / 2;
  return [O, 2 * area / p];
}
const clampTo = (p, h = 240) => [Math.min(345, Math.max(15, p[0])), Math.min(h - 15, Math.max(15, p[1]))];

function quadDemo(host) {
  host.innerHTML = `<section class="sheet"><h2>Четырёхугольник: потяни вершины</h2>
    <p>Описать окружность можно, если суммы противоположных углов равны 180°. Вписать, если суммы противоположных сторон равны.</p>
    <svg class="fig" viewBox="0 0 360 240" role="img" aria-label="Четырёхугольник"></svg><div class="reads"></div><p class="verdict"></p></section>`;
  const svg = host.querySelector("svg"), reads = host.querySelector(".reads"), verdict = host.querySelector(".verdict");
  const pts = [[85, 170], [260, 195], [290, 65], [110, 55]];
  function convex() {
    const turn = i => { const [a, b, c] = [pts[i], pts[(i + 1) % 4], pts[(i + 2) % 4]]; return (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]); };
    const t = [0, 1, 2, 3].map(turn);
    return t.every(v => v > 0) || t.every(v => v < 0);
  }
  function draw() {
    const [A, B, C, D] = pts, ok = convex();
    const out = circumcircle(A, B, C), names = "ABCD";
    const labels = pts.map((p, i) => { const mid = [(A[0] + B[0] + C[0] + D[0]) / 4, (A[1] + B[1] + C[1] + D[1]) / 4]; return say(on(p, 18, dir(mid, p)), names[i]); }).join("");
    svg.innerHTML = (out && out[1] < 400 ? ring(out[0], out[1], "dash") : "") + shape(pts) + grips(pts) + labels;
    if (!ok) { reads.innerHTML = ""; verdict.textContent = "Фигура не выпуклая: верни вершины, чтобы углы были меньше 180°."; return; }
    const ac = angle(A, B, D) + angle(C, B, D), bd = angle(B, A, C) + angle(D, A, C);
    const unit = v => Math.round(v / 10), s1 = unit(dist(A, B)) + unit(dist(C, D)), s2 = unit(dist(B, C)) + unit(dist(D, A));
    reads.innerHTML = read("∠A + ∠C", Math.round(ac) + "°") + read("∠B + ∠D", Math.round(bd) + "°") + read("AB + CD", s1) + read("BC + DA", s2);
    const round = Math.abs(ac - 180) <= 2, tangent = s1 === s2;

  }
  draggable(svg, pts, p => clampTo(p), draw);
  draw();
}

  }

  return { text: `Выпуклый четырёхугольник со сторонами ${a}, ${b}, ${c}, ${d} (идут по порядку)`, q: "in", yes: a + c === b + d, why: `Суммы противоположных сторон: ${a} + ${c} = ${a + c} и ${b} + ${d} = ${b + d}.` };

function figureQuiz(host) {

      <p class="why" hidden></p><button class="more" hidden>Дальше</button><p class="note">${done ? `Верно: ${right} из ${done}` : ""}</p></section>`;
    const why = host.querySelector(".why"), more = host.querySelector(".more");
    host.querySelectorAll(".option").forEach(b => { b.onclick = () => {

      why.textContent = `${ok ? "Верно." : `Неверно, ${item.yes ? "можно" : "нельзя"}.`} ${item.why}`;

    more.onclick = next;
  }
  next();
}

      { ask: "Запишем отношение сторон.", right: "AH / CH = CH / HB", wrong: [["AH / CH = HB / CH", "Вершине A соответствует C, поэтому отношение перевёрнуто."], ["AH / HB = CH / CH", "Сравниваем соответственные стороны, а не стороны одного отрезка."]], note: "Катеты подобных треугольников пропорциональны." },
      { ask: "Какой вывод?", right: "CH² = AH · HB", wrong: [["CH² = AH + HB", "Из пропорции получается произведение, а не сумма."], ["CH = AH · HB", "В пропорции CH встречается дважды."]], note: "Произведение крайних равно произведению средних. Теорема доказана." },
    ] },
  { title: "Теорема косинусов", grade: 9, claim: "a² = b² + c² − 2bc · cos A",
    idea: "Высота делит треугольник на два прямоугольных, в них работает теорема Пифагора. Разберём случай острого угла A.",
    figure(step) {
      const A = [50, 195], C = [310, 195], B = [140, 60], H = [140, 195];
      return fig(shape([A, C, B]) + (step >= 1 ? seg(B, H, "new") + square(H, A, B, 10) + say([140, 210], "H") : "") + mark(A, C, B, "") + say([36, 203], "A") + say([324, 203], "C") + say([140, 46], "B") + say([82, 120], "c") + say([232, 120], "a") + say([230, 210], "b"));
    },
    steps: [
      { ask: "С чего начать?", right: "Проведём высоту BH на сторону AC", wrong: [["Проведём биссектрису BH на сторону AC", "В биссектрисе нет прямого угла для теоремы Пифагора."], ["Проведём медиану BH на сторону AC", "Медиана тоже не даёт прямого угла."]], note: "Появляются два прямоугольных треугольника." },
      { ask: "Выразим отрезки из треугольника ABH.", right: "AH = c · cos A, BH = c · sin A", wrong: [["AH = c · sin A, BH = c · cos A", "AH прилежит к углу A, поэтому косинус."], ["AH = c / cos A, BH = c / sin A", "Катет это гипотенуза, умноженная на косинус или синус."]], note: "c это гипотенуза треугольника ABH." },
      { ask: "Запишем Пифагора для треугольника BHC.", right: "a² = c²sin²A + (b − c cos A)²", wrong: [["a² = c²sin²A + (b + c cos A)²", "HC = AC − AH, здесь разность."], ["a = c sin A + (b − c cos A)", "Складываются квадраты катетов, а не сами катеты."]], note: "HC = b − AH = b − c · cos A." },
      { ask: "Раскроем скобку и сгруппируем.", right: "a² = c²(sin²A + cos²A) + b² − 2bc cos A", wrong: [["a² = c²(sin²A − cos²A) + b² − 2bc cos A", "При раскрытии квадрата c²cos²A идёт с плюсом."], ["a² = c²(sin²A + cos²A) + b² + 2bc cos A", "Квадрат разности даёт минус перед удвоенным произведением."]], note: "(b − c cos A)² = b² − 2bc cos A + c²cos²A." },
      { ask: "Какой вывод?", right: "a² = b² + c² − 2bc · cos A", wrong: [["a² = b² + c² + 2bc · cos A", "Минус сохраняется."], ["a² = b² − c² − 2bc · cos A", "sin²A + cos²A = 1, поэтому c² с плюсом."]], note: "sin²A + cos²A = 1. Теорема доказана." },
    ] },
].sort((a, b) => a.grade - b.grade);

function proofsList(host) {
  const list = PROOFS.filter(p => p.grade <= LIMIT);
  host.innerHTML = `<section class="sheet"><h2>Доказательства с рисунком</h2><p>Выбирай следующий шаг. Рисунок будет меняться, а при ошибке страница объяснит почему.</p><div class="block">${list.map((p, i) => `<button class="card" data-i="${i}">${p.title}<br><span class="note">${p.claim}</span></button>`).join("")}</div></section>`;
  host.querySelectorAll(".card").forEach(b => { b.onclick = () => proofView(host, list[b.dataset.i]); });
}
function proofView(host, proof) {
  let step = 0;
  function show() {
    const stage = proof.steps[step], done = proof.steps.slice(0, step).map(s => `<li>${s.right}</li>`).join("");
    if (!stage) {
      host.innerHTML = `<section class="sheet"><h2>${proof.title}: доказано</h2>${proof.figure(99)}<ol class="chain">${done}</ol><p><b>Итог:</b> ${proof.claim}</p><button class="again">Собрать ещё раз</button><button class="back">Другие доказательства</button></section>`;
      host.querySelector(".again").onclick = () => proofView(host, proof);
      host.querySelector(".back").onclick = () => proofsList(host);
      return;
    }
    const options = shuffle([stage.right, ...stage.wrong.map(w => w[0])]);
    host.innerHTML = `<section class="sheet"><h2>${proof.title}, шаг ${step + 1} из ${proof.steps.length}</h2>
      <p><b>Докажем:</b> ${proof.claim}</p>${step ? "" : `<p class="note">${proof.idea}</p>`}${proof.figure(step)}${done ? `<ol class="chain">${done}</ol>` : ""}
      <p><b>${stage.ask}</b></p><div class="block">${options.map((o, i) => `<button class="option" data-i="${i}">${o}</button>`).join("")}</div>
      <p class="why" hidden></p><button class="main next" hidden>Дальше</button></section>`;
    const why = host.querySelector(".why"), next = host.querySelector(".next");
    host.querySelectorAll(".option").forEach(b => { b.onclick = () => {
      const text = options[b.dataset.i], ok = text === stage.right;
      b.classList.add(ok ? "right" : "wrong");
      why.hidden = false;
      why.className = "why " + (ok ? "right" : "wrong");
      why.textContent = ok ? stage.note : stage.wrong.find(w => w[0] === text)[1];
      if (ok) next.hidden = false;
    }; });
    next.onclick = () => { step++; show(); };
  }
  show();
}

const nav = document.getElementById("tabs");
function openTab(tab) {
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", b.dataset.id === tab.id));
  view.innerHTML = "";
  tab.open(view);
}
nav.innerHTML = TABS.map(t => `<button data-id="${t.id}">${t.title}</button>`).join("");
nav.querySelectorAll("button").forEach((b, i) => { b.onclick = () => openTab(TABS[i]); });
