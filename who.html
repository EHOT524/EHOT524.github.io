<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Игра для школьников «Кто я?»: угадай учёного, понятие или вещество по подсказкам.">
<title>Кто я?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="game-kit.css">
<style>
.clues { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.clues li { background: var(--card); border: 1px solid var(--card-edge); border-radius: 6px; padding: 10px 12px; line-height: 1.35; }
.clues li span { display: block; font-size: 12px; color: var(--muted); }
.clues li.locked { background: var(--soft); border-style: dashed; border-color: var(--soft-edge); color: var(--muted); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opts button { min-height: 54px; line-height: 1.2; overflow-wrap: anywhere; }
.opts button.right { background: var(--good); border-color: var(--good); color: var(--accent-ink); opacity: 1; }
.opts button.wrong { border-color: var(--hit); color: var(--hit); text-decoration: line-through; }
.kind { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main class="wrap" id="home">
  <header>
    <h1>Кто я?</h1>
    <p class="lead" style="margin-top:8px">Загадка говорит о себе: учёный, понятие или вещество. Подсказки открываются по одной.
      Угадаешь с первой — 4 звезды, со второй — 3 и так далее. Ошибся — откроется следующая подсказка. В игре 8 загадок.</p>
  </header>
  <button class="main" id="go">🕵️ Начать</button>
  <p class="note" id="record"></p>
  <p class="note" id="none" hidden>Для этого режима загадок пока мало.</p>
</main>

<main class="wrap" id="game" hidden>
  <div class="top">
    <button class="back" id="quit">⏹ Закончить</button>
    <div class="hud"><span id="round"></span><span id="score"></span></div>
  </div>
  <p class="kind" id="kind"></p>
  <ol class="clues" id="clues"></ol>
  <div class="opts" id="opts"></div>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="row"><button id="more">🔎 Ещё подсказка</button><button class="main" id="next" hidden>Дальше →</button></div>
</main>

<main class="wrap" id="over" hidden>
  <h1>Все загадки разгаданы?</h1>
  <section class="sheet">
    <p class="big" id="final"></p>
    <p id="found"></p>
    <p id="best"></p>
  </section>
  <section class="sheet">
    <h2>Кто это был</h2>
    <ul class="errors" id="learn"></ul>
  </section>
  <div class="row"><button id="claim" hidden></button></div>
  <div class="row"><button class="main" id="again">Ещё раз</button><button id="menu">Назад</button></div>
</main>

<script src="bot-xp.js"></script>
<script src="game-kit.js"></script>

  chem: [

    { a: "углекислый газ", k: "вещество", g: 8, c: ["Меня выдыхают люди и животные.", "Растения поглощают меня при фотосинтезе.", "От меня мутнеет известковая вода.", "Моя формула CO₂."] },
    { a: "серная кислота", k: "вещество", g: 8, c: ["Я тяжёлая маслянистая жидкость.", "Я обугливаю сахар и бумагу.", "Разбавляя меня, льют меня в воду, а не воду в меня.", "Моя формула H₂SO₄."] },
    { a: "Дмитрий Менделеев", k: "учёный", g: 8, c: ["Я русский химик XIX века.", "Я оставил в своей таблице пустые клетки для ещё не открытых элементов.", "Я открыл периодический закон.", "Элемент № 101 назван в мою честь."] },
    { a: "метан", k: "вещество", g: 10, c: ["Я самый простой углеводород.", "Я главная часть природного газа.", "В моей молекуле один атом углерода и четыре атома водорода.", "Моя формула CH₄."] },
    { a: "этанол", k: "вещество", g: 10, c: ["Я спирт.", "Я закипаю при 78 °C.", "Я получаюсь при брожении сахаров.", "Моя формула C₂H₅OH."] },
    { a: "глюкоза", k: "вещество", g: 10, c: ["Я сладкий углевод.", "Я образуюсь в листьях при фотосинтезе.", "Я главный источник энергии для клеток.", "Моя формула C₆H₁₂O₆."] },
  ],
};
const KIND = { "учёный": "🧑‍🔬 Кто я? Учёный", "понятие": "💡 Что я? Понятие", "вещество": "🧪 Что я? Элемент или вещество" };

const POOL = (WHO[subject] || []).filter(x => x.g <= grade);

let state = null;

function options(item) {
  const same = POOL.filter(x => x !== item && x.k === item.k && x.a !== item.a);
  const other = POOL.filter(x => x !== item && x.k !== item.k && x.a !== item.a);
  const wrong = [...shuffle(same), ...shuffle(other)].map(x => x.a).filter((a, i, all) => all.indexOf(a) === i).slice(0, 3);
  return shuffle([item.a, ...wrong]);
}

function start() {
  const items = shuffle(POOL).slice(0, ROUND);
  state = { items, i: 0, score: 0, found: 0, learned: [] };
  Kit.show("game");
  ask();
}

function ask() {
  const s = state, item = s.items[s.i];
  s.item = item; s.shown = 1; s.done = false; s.opts = options(item); s.bad = new Set();
  $("next").hidden = true;
  $("more").hidden = false;
  $("hint").textContent = "";
  $("hint").className = "hint";
  draw();
}

function draw() {
  const s = state, item = s.item;
  $("round").textContent = `${s.i + 1}/${s.items.length}`;
  $("score").textContent = `★ ${s.score}`;
  $("kind").textContent = KIND[item.k];
  $("clues").replaceChildren(...item.c.map((text, k) => {
    const li = document.createElement("li"), tag = document.createElement("span");
    tag.textContent = `Подсказка ${k + 1}` + (k < s.shown ? "" : " — ещё закрыта");
    li.append(tag);
    if (k < s.shown) li.append(text); else li.className = "locked";
    return li;
  }));
  $("opts").replaceChildren(...s.opts.map(a => {
    const b = document.createElement("button");
    b.textContent = a;
    if (s.done && a === item.a) b.className = "right";
    else if (s.bad.has(a)) b.className = "wrong";
    b.disabled = s.done || s.bad.has(a);
    b.addEventListener("click", () => guess(a));
    return b;
  }));
  $("more").disabled = s.done || s.shown >= MAX;
}

function guess(a) {
  const s = state;
  if (!s || s.done) return;
  if (a === s.item.a) {
    const stars = MAX + 1 - s.shown;
    s.score += stars; s.found++;
    s.done = true;
    $("hint").className = "hint ok";
    $("hint").textContent = `Верно! +${stars} ${plural(stars, "звезда", "звезды", "звёзд")}`;
  } else {
    s.bad.add(a);
    try { navigator.vibrate?.(40); } catch {}
    if (s.shown < MAX) {
      s.shown++;
      $("hint").textContent = "Не угадал, вот ещё подсказка";
    } else {
      s.done = true;
      $("hint").textContent = `Это ${s.item.a}`;
    }
  }
  if (s.done) {
    s.learned.push(`${s.item.a}: ${s.item.c[MAX - 1]}`);
    $("next").hidden = false;
    $("more").hidden = true;
  }
  draw();
}

function more() {
  const s = state;
  if (!s || s.done || s.shown >= MAX) return;
  s.shown++;
  draw();
}

function next() {
  if (state.i + 1 >= state.items.length) return finish();
  state.i++;
  ask();
}

function finish() {
  const s = state;
  state = null;
  if (s.item && !s.done) s.learned.push(`${s.item.a}: ${s.item.c[MAX - 1]}`);
  const record = Kit.saveBest("who", s.score);
  $("final").textContent = `${s.score} ${plural(s.score, "звезда", "звезды", "звёзд")}`;
  $("found").textContent = `Разгадано ${s.found} из ${s.items.length}`;
  $("best").textContent = record && s.score ? "🏆 Новый рекорд!" : `Рекорд: ${Kit.best("who")}`;
  Kit.list($("learn"), s.learned);
  BotXP.add("w", subject, s.found);
  BotXP.button($("claim"), "w", subject);
  Kit.show("over");
}

function home() {
  state = null;
  const enough = POOL.length >= 6;
  $("go").hidden = !enough;
  $("none").hidden = enough;
  $("record").textContent = Kit.best("who") ? `Рекорд: ${Kit.best("who")} ★` : "";
  Kit.show("home");
}

$("go").addEventListener("click", start);
$("again").addEventListener("click", start);
$("more").addEventListener("click", more);
$("next").addEventListener("click", next);
$("quit").addEventListener("click", () => state ? finish() : home());
$("menu").addEventListener("click", home);
home();
</script>
